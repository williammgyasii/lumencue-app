name: deploy-api

# Triggers a Render deploy for the LumenCue Cloud API (Docker web service).
# Render builds from the repo Dockerfile; this workflow waits for the deploy to go live.
#
# Required GitHub secrets:
#   RENDER_API_KEY      — from https://dashboard.render.com/u/settings#api-keys
#   RENDER_SERVICE_ID   — srv-… for the lumencue-api web service

on:
  push:
    branches: [main]
    paths:
      - "src/ChurchProjection.Api/**"
      - "src/ChurchProjection.Core/**"
      - "Dockerfile"
      - "Directory.Build.props"
      - "render.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-d9qj201t0dsc7385d3r0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Render CLI
        run: |
          curl -L https://github.com/render-oss/cli/releases/download/v1.1.0/cli_1.1.0_linux_amd64.zip -o render.zip
          unzip render.zip
          sudo mv cli_v1.1.0 /usr/local/bin/render

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CI: true
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --commit "${{ github.sha }}" \
            --wait --confirm -o json

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 10 --max-time 30 \
            https://lumencue-api.onrender.com/health
