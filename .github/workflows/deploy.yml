name: deploy-api

# Deploys the LumenCue Cloud API Worker + container image to Cloudflare.
# Uses wrangler (not Render). The Worker secret NEON_CONNECTION_STRING is
# already stored on the Cloudflare account — do not put it in GitHub.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN — Account API token with Workers Scripts:Edit
#                          and Containers write (Workers Paid).

on:
  push:
    branches: [main]
    paths:
      - "src/ChurchProjection.Api/**"
      - "src/ChurchProjection.Core/**"
      - "Dockerfile"
      - "Directory.Build.props"
      - "workers/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e23518956f08ff35812d9ab001a39880
          command: deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="https://lumencue-api.williammgyasii.workers.dev/health"
          for i in $(seq 1 20); do
            BODY=$(curl -sS --max-time 90 "$URL" || true)
            echo "attempt ${i}: ${BODY}"
            if echo "${BODY}" | jq -e '.ok == true' >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for a healthy Cloudflare deploy"
          exit 1
