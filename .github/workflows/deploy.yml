name: deploy-api

# Triggers a Render deploy for the LumenCue Cloud API (Docker web service).
# Uses the Render REST API — the official CLI v1.1.0 panics in CI on
# `deploys create --wait --confirm` (nil deref in nonInteractiveDeployCreate).
#
# Required GitHub secrets:
#   RENDER_API_KEY      — from https://dashboard.render.com/u/settings#api-keys

on:
  push:
    branches: [main]
    paths:
      - "src/ChurchProjection.Api/**"
      - "src/ChurchProjection.Core/**"
      - "Dockerfile"
      - "Directory.Build.props"
      - "render.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-d9qj201t0dsc7385d3r0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          CREATE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -d "{\"commitId\":\"${{ github.sha }}\"}")
          echo "$CREATE"
          DEPLOY_ID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Render did not start a deploy. Check RENDER_API_KEY and service id."
            exit 1
          fi
          echo "Deploy ${DEPLOY_ID} started"

          for _ in $(seq 1 40); do
            STATUS=$(curl -sS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              | jq -r '.status // .deploy.status // empty')
            echo "status=${STATUS}"
            case "${STATUS}" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "Deploy failed: ${STATUS}"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Render deploy ${DEPLOY_ID}"
          exit 1

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 10 --max-time 30 \
            https://lumencue-api.onrender.com/health
